<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Store addresses, not every road</title>
  <desc id="desc">The legacy architecture stores billions of connections between stars. The new architecture stores a packed star catalog, finds exact nearby neighbors on demand, and uses a small portal guide for long routes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#18233a"/></linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="105" cy="82" r="2" fill="#fff"/><circle cx="1100" cy="90" r="3" fill="#fff"/><circle cx="1145" cy="530" r="2" fill="#fff"/><circle cx="530" cy="620" r="2" fill="#fff"/><circle cx="720" cy="65" r="2" fill="#fff"/>
  <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="38" font-weight="700">Store addresses, not every road</text>
  <text x="600" y="102" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="19">The architectural change that made ten million stars practical</text>

  <rect x="55" y="145" width="430" height="445" rx="18" fill="#211827" stroke="#7f1d1d" stroke-width="2"/>
  <text x="270" y="190" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="26" font-weight="700">Before: precompute the roads</text>
  <g stroke="#ef4444" stroke-opacity=".5" stroke-width="2">
    <line x1="130" y1="270" x2="225" y2="235"/><line x1="130" y1="270" x2="205" y2="355"/><line x1="130" y1="270" x2="325" y2="280"/><line x1="130" y1="270" x2="385" y2="380"/>
    <line x1="225" y1="235" x2="205" y2="355"/><line x1="225" y1="235" x2="325" y2="280"/><line x1="225" y1="235" x2="385" y2="380"/><line x1="225" y1="235" x2="300" y2="445"/>
    <line x1="205" y1="355" x2="325" y2="280"/><line x1="205" y1="355" x2="385" y2="380"/><line x1="205" y1="355" x2="300" y2="445"/>
    <line x1="325" y1="280" x2="385" y2="380"/><line x1="325" y1="280" x2="300" y2="445"/><line x1="385" y1="380" x2="300" y2="445"/>
  </g>
  <g fill="#fde68a" stroke="#fff" stroke-width="1"><circle cx="130" cy="270" r="8"/><circle cx="225" cy="235" r="8"/><circle cx="205" cy="355" r="8"/><circle cx="325" cy="280" r="8"/><circle cx="385" cy="380" r="8"/><circle cx="300" cy="445" r="8"/></g>
  <text x="270" y="510" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="19">1.59 billion saved connections</text>
  <text x="270" y="543" text-anchor="middle" fill="#fca5a5" font-family="sans-serif" font-size="23" font-weight="700">29 GiB for 1.13M stars</text>

  <path d="M510 367 H575" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="600" y="145" width="545" height="445" rx="18" fill="#0b2530" stroke="#047857" stroke-width="2"/>
  <text x="872" y="190" text-anchor="middle" fill="#a7f3d0" font-family="sans-serif" font-size="26" font-weight="700">Now: calculate roads when asked</text>

  <rect x="640" y="230" width="155" height="90" rx="12" fill="#123047" stroke="#38bdf8"/>
  <text x="717" y="265" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="18" font-weight="700">Packed catalog</text>
  <text x="717" y="292" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="15">star addresses</text>

  <rect x="640" y="405" width="155" height="90" rx="12" fill="#123c32" stroke="#34d399"/>
  <text x="717" y="440" text-anchor="middle" fill="#d1fae5" font-family="sans-serif" font-size="18" font-weight="700">Portal guide</text>
  <text x="717" y="467" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="15">broad directions</text>

  <rect x="850" y="310" width="245" height="110" rx="12" fill="#28234b" stroke="#a78bfa"/>
  <text x="972" y="350" text-anchor="middle" fill="#ede9fe" font-family="sans-serif" font-size="19" font-weight="700">Neighbor oracle</text>
  <text x="972" y="380" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="15">exact nearby jumps</text>
  <text x="972" y="402" text-anchor="middle" fill="#c4b5fd" font-family="sans-serif" font-size="15">for this route only</text>

  <path d="M795 275 C835 275 825 345 850 350" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M795 450 C835 450 825 390 850 385" fill="none" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="872" y="523" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="19">10,794,958 stars</text>
  <text x="872" y="555" text-anchor="middle" fill="#6ee7b7" font-family="sans-serif" font-size="23" font-weight="700">336.8 MiB catalog on disk</text>
</svg>

