{% extends "base.html" %}
{% from 'macros.html' import post_listing with context %}

{% block title %}{{ SITENAME }} - {{ tag }}{% endblock %}

{% block content %}
<header class="listing-header">
    <p class="eyebrow">Tag</p>
    <h1>{{ tag }}</h1>
</header>
<div class="post-list">
    {% for article in articles_page.object_list %}
    {{ post_listing(article) }}
    {% endfor %}
</div>
{% endblock %}
