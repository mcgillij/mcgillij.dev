{% extends "base.html" %}

{% block title %}Tags - {{ SITENAME }}{% endblock %}

{% block content %}
<header class="listing-header">
    <p class="eyebrow">Browse</p>
    <h1>All tags</h1>
</header>
<ul class="taxonomy-list">
    {% for tag, articles in tags %}
    <li><a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }}</a><span>{{ articles|count }} posts</span></li>
    {% endfor %}
</ul>
{% endblock %}
