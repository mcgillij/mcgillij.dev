{% extends "base.html" %}

{% block content %}
<h1>All Tags</h1>
<hr>
<ul class="tagcloud">
    {% for tag, articles in tags %}
    <li class="tag-2">
        <a href="{{ SITEURL }}/{{ tag.url }}">
            {{ tag }}
            <span class="badge">{{ articles|count }}</span>
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
