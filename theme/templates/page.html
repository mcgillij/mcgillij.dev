{% extends "base.html" %}

{% block title %}
{{ page.title }} - {{ SITENAME }}
{% endblock %}


{% block content %}
<div class="article">
    {% if page.cover_image_url %}
    <div class="cover">
        <img src="{{ page.cover_image_url }}" alt="Cover image">
    </div>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <div class="page-content">
        {{ page.content }}
    </div>
</div>

{% endblock %}
